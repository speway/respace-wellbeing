name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-mobile.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install web dependencies
        run: pnpm install

      - name: Build web application
        run: pnpm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: respace-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Application
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH="/Applications/Xcode_26.0.app"
          if [ ! -d "$XCODE_PATH" ]; then
            for app in /Applications/Xcode_26*.app; do
              case "$app" in
                *beta*|*Beta*) continue ;;
                *) if [ -d "$app" ]; then XCODE_PATH="$app"; break; fi ;;
              esac
            done
          fi
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Error: No stable Xcode 26.x installation found in /Applications"
            ls -d /Applications/Xcode* 2>/dev/null || true
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          XC_VER=$(xcodebuild -version)
          echo "$XC_VER"
          case "$XC_VER" in
            *Beta*|*beta*)
              echo "Error: Selected Xcode is a beta release"
              exit 1
              ;;
            Xcode\ 26.*)
              echo "Xcode 26.x confirmed"
              ;;
            *)
              echo "Error: Xcode major version is not 26.x"
              exit 1
              ;;
          esac

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install web dependencies
        run: pnpm install

      - name: Build web application
        run: pnpm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode project (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          if [ -d "build/Build/Products/Release-iphoneos/App.app" ]; then
            cp -r build/Build/Products/Release-iphoneos/App.app build/Payload/
            cd build
            zip -qr Respace-unsigned.ipa Payload
          else
            echo "Error: App.app not found in Release-iphoneos"
            exit 1
          fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: respace-ios-unsigned-ipa
          path: build/Respace-unsigned.ipa
          if-no-files-found: error
